<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <main class="game">
        <header class="topbar">
            <button class="icon-button shop-button" id="openShopButton">
                <i class="fa-solid fa-cart-arrow-down"></i>
                <span>
                    shop
                </span>
            </button>
            <div class="balance">
                <div class="balance-main">
                    <span id="score">
                        0
                    </span>
                </div>
                <div class="income">
                    +<span>24</span> / sec
                </div>
            </div>
            <button class="icon-button settings-button">
               <i class="fa-solid fa-bars"></i> 
            </button>
        </header> 
        <section class="click-zone">
            <button class="click-button" id="clickButton">
                <div class="finger">
                    <i class="fa-regular fa-hand-pointer"></i>
                </div>
                <div class="click-label">
                    click
                </div>
                <div class="click-hint">
                    tap to earn
                </div>
            </button>
        </section>
        <footer class="stats">
            <div class="stats-card">
                <i class="stats-icon fa-solid fa-play"></i>
                <strong class="stats-value" id="totalClicks">0</strong>
                <small class="stats-text">total clicks</small>
            </div>
            <div class="stats-card">
                <i class="stats-icon fa-solid fa-bolt-lightning"></i>
                <strong class="stats-value">24 / sec</strong>
                <small class="stats-text">auto click</small>
            </div>
            <div class="stats-card">
                <i class="stats-icon fa-solid fa-trophy"></i>
                <strong class="stats-value">12</strong>
                <small class="stats-text">achievements</small>
            </div>
        </footer>
    </main>
    <div class="overlay" id="overlay"></div>
    <div class="shop-panel" id="shopPanel">
        <div class="shop-header">
            <div>
                <span class="eyebrow">
                    upgrades
                </span>
                <h2>Магазин</h2>
            </div>
            <button class="close-button" id="closeShopButton"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="upgrade-list">
            <button class="upgrade">
                <span class="upgrade-icon"> <i class="fa-solid fa-bolt-lightning"></i></span>
                <span class="upgrade-info">
                    <strong>Сильный клик</strong>
                    <small>+1 за каждый клик</small>
                </span>
                <span class="upgrade-price">50</span>
            </button>
            <button class="upgrade">
                <span class="upgrade-icon"> <i class="fa-solid fa-bolt-lightning"></i></span>
                <span class="upgrade-info">
                    <strong>Сильный клик</strong>
                    <small>+1 за каждый клик</small>
                </span>
                <span class="upgrade-price">100</span>
            </button>
            <button class="upgrade">
                <span class="upgrade-icon"> <i class="fa-solid fa-bolt-lightning"></i></span>
                <span class="upgrade-info">
                    <strong>Сильный клик</strong>
                    <small>+1 за каждый клик</small>
                </span>
                <span class="upgrade-price">150</span>
            </button>
        </div>
    </div>
     <script src="ui.js"></script>
     <script src="game.js"></script>
</body>
</html>
